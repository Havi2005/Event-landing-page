<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Tech Fest</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-bold mb-6 text-center">Event Registration</h2>

    <form>
      <input type="text" placeholder="Full Name" class="w-full mb-4 p-2 border rounded">
      <input type="email" placeholder="Email" class="w-full mb-4 p-2 border rounded">
      <input type="text" placeholder="Department" class="w-full mb-4 p-2 border rounded">

      <button class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
        Submit
      </button>
    </form>

    <div class="text-center mt-4">
      <a href="index.html" class="text-blue-600 underline">Back to Home</a>
    </div>
  </div>

</body>
</html>
